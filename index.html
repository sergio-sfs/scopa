.btns{display:flex;gap:6px;padding:6px 8px 8px}

.ov{position:absolute;inset:0;background:#000000c8;display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.box{background:#0d4d33;border-radius:16px;padding:18px;width:100%;max-height:100%;overflow:auto}
.box h2{margin:0 0 10px}

#app.s1{--tx:18px;--cw:64px;--ch:92px;--fs:26px}

</defs></svg>
<div id="app"></div>
<script>
/*ENGINE*/
const SN=['Denari','Coppe','Spade','Bastoni'],SS=['♦','♥','♠','♣'];
const RL=r=>r===8?'F':r===9?'C':r===10?'R':String(r);
const RN=r=>({1:'asso',8:'fante',9:'cavallo',10:'re'}[r]||String(r));
const cs=c=>RN(c.r)+' di '+SN[c.s].toLowerCase();
let SPEED=1;const sleep=ms=>new Promise(r=>setTimeout(r,ms*SPEED));
function makeDeck(){const d=[];for(let s=0;s<4;s++)for(let r=1;r<=10;r++)d.push({id:s*10+r-1,s,r});return d;}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const PV={7:21,6:18,1:16,5:15,4:14,3:13,2:12,8:10,9:10,10:10};
const isSette=c=>c.s===0&&c.r===7;

// Prese possibili giocando una carta di valore r (variante 'n' normale, 'a' d'assi)
function captures(r,table,variant){
  if(variant==='a'&&r===1){
    const a=table.find(c=>c.r===1);
    if(a)return[[a]];
    return table.length?[table.slice()]:[];
  }
  const eq=table.filter(c=>c.r===r);
  if(eq.length)return eq.map(c=>[c]);
  const n=table.length;if(n>16)return[];
  const out=[];
  for(let m=1;m<(1<<n);m++){let s=0,k=0;for(let i=0;i<n;i++)if(m&(1<<i)){s+=table[i].r;k++;}if(s===r&&k>=2)out.push(table.filter((_,i)=>m&(1<<i)));}
  return out;
}
function primiera(pile){let t=0;for(let s=0;s<4;s++){let b=0;for(const c of pile)if(c.s===s&&PV[c.r]>b)b=PV[c.r];if(!b)return 0;t+=b;}return t;}

/* ===== Stato di gioco ===== */
let G=null,ON=null;const UI={menu:false,rules:false};
const H=()=>G.players[0];
const say=(m,err)=>{G.msg=m;G.err=!!err;};
const nextIdx=i=>(i+1)%G.players.length;
const BOTS=['Anna','Bruno','Carla','Dario','Elena','Fabio','Giulia','Marta','Nadia','Paolo','Rita','Sandro','Teresa','Ugo','Vera','Enzo','Irene','Gino','Silvia','Renzo','Chiara','Mauro'];
const TARGETV=[0,11,21,31];
const sideOf=i=>G.sides.findIndex(s=>s.includes(i));
const sideName=(s,nm)=>s.map(nm).join(' + ');

function startGame(nopp,allBots,pre){
  const N=nopp+1;
  G={variant:OPT.variant===1?'a':'n',players:[],table:[],stock:[],turn:0,dealer:N-1,round:0,phase:'wait',sel:null,tsel:[],msg:'',err:false,over:false,rows:null,target:TARGETV[OPT.game],last:-1,mv:null,
     sides:(N===4&&OPT.team)?[[0,2],[1,3]]:Array.from({length:N},(_,i)=>[i])};
  G.players.push({name:'Tu',human:!allBots,hand:[],pile:[],scope:0,score:0});
  const bn=shuffle(BOTS.filter(x=>!(ON&&ON.nicks&&ON.nicks.includes(x))));
  for(let i=0;i<nopp;i++)G.players.push({name:bn[i],human:false,hand:[],pile:[],scope:0,score:0});
  UI.menu=false;UI.rules=false;
  if(pre)pre(G);
  newRound();
}
function deal3(){
  const N=G.players.length;
  for(let k=0;k<N;k++){const p=G.players[(G.dealer+1+k)%N];for(let j=0;j<3;j++)p.hand.push(G.stock.pop());p.hand.sort((a,b)=>a.r-b.r||a.s-b.s);}
}
function newRound(){
  let ok=false;
  while(!ok){
    G.stock=shuffle(makeDeck());G.table=G.stock.splice(0,4);
    ok=G.variant==='a'?!G.table.some(c=>c.r===1):G.table.filter(c=>c.r===10).length<3;
  }
  for(const p of G.players){p.hand=[];p.pile=[];p.scope=0;}
  G.last=-1;G.mv=null;G.rows=null;G.sel=null;G.tsel=[];G.over=false;G.winMembers=null;
  if(G.round>0)G.dealer=nextIdx(G.dealer);
  G.round++;G.turn=nextIdx(G.dealer);
  deal3();
  startTurn();
}
const V=(n,t,s)=>n==='Tu'?'Tu '+s:n+' '+t;
function moveText(mv,nm){
  if(!mv)return'';
  const n=nm(mv.by);
  let t=mv.take.length?V(n,'prende','prendi')+' '+mv.take.map(cs).join(' + ')+' con '+cs(mv.card):V(n,'posa','posi')+' '+cs(mv.card);
  if(mv.scopa)t+=' — SCOPA! 🧹';
  return t+'.';
}
async function startTurn(){
  const g=G,p=G.players[G.turn];
  if(ON&&ON.role==='host')hostSave();
  G.sel=null;G.tsel=[];
  const last=moveText(G.mv,i=>G.players[i].name);
  if(p.remote){if(p.conn){G.phase='wait';say((last?last+' ':'')+p.name+' sta giocando…');render();}else awayTurn(G.turn);return;}
  if(p.human){G.phase='play';say((last?last+' ':'')+'Tocca a te: scegli una carta.');render();return;}
  G.phase='wait';say((last?last+' ':'')+p.name+' sta giocando…');render();
  await sleep(1000);if(G!==g)return;
  await botTurn(G.turn,g);
}
function applyMove(k,cardId,takeIds){
  const P=G.players[k],c=P.hand.find(x=>x.id===cardId);if(!c)return null;
  const opts=captures(c.r,G.table,G.variant);let take=[];
  if(opts.length){const ts=new Set(takeIds||[]);const o=opts.find(o=>o.length===ts.size&&o.every(x=>ts.has(x.id)));if(!o)return null;take=o;}
  else if(takeIds&&takeIds.length)return null;
  P.hand=P.hand.filter(x=>x.id!==cardId);
  let scopa=false;
  if(take.length){
    const ids=new Set(take.map(x=>x.id));G.table=G.table.filter(x=>!ids.has(x.id));
    P.pile.push(c,...take);G.last=k;
    const lastPlay=G.stock.length===0&&G.players.every(p=>!p.hand.length);
    if(!G.table.length&&!lastPlay&&!(G.variant==='a'&&c.r===1)){P.scope++;scopa=true;}
  }else G.table.push(c);
  G.mv={by:k,card:c,take,scopa};G.sel=null;G.tsel=[];
  return G.mv;
}
function afterMove(){
  if(G.players.every(p=>!p.hand.length)){if(G.stock.length)deal3();else{endRound();return;}}
  G.turn=nextIdx(G.turn);startTurn();
}
function endRound(){
  if(G.table.length&&G.last>=0){G.players[G.last].pile.push(...G.table);G.table=[];}
  const st=G.sides.map(s=>{const pile=s.flatMap(i=>G.players[i].pile);return{cards:pile.length,coins:pile.filter(c=>c.s===0).length,sette:pile.some(isSette)?1:0,prim:primiera(pile),scope:s.reduce((a,i)=>a+G.players[i].scope,0)};});
  const best=f=>{let mx=-1,idx=-1,tie=false;st.forEach((x,i)=>{const v=f(x);if(v>mx){mx=v;idx=i;tie=false;}else if(v===mx)tie=true;});return tie||mx<=0?-1:idx;};
  const wc=best(x=>x.cards),wd=best(x=>x.coins),ws=best(x=>x.sette),wp=best(x=>x.prim);
  G.rows=st.map((x,i)=>{
    const pts=(wc===i?1:0)+(wd===i?1:0)+(ws===i?1:0)+(wp===i?1:0)+x.scope;
    G.sides[i].forEach(j=>G.players[j].score+=pts);
    return{members:G.sides[i].slice(),cards:x.cards,coins:x.coins,sette:x.sette,prim:x.prim,scope:x.scope,wc:wc===i,wd:wd===i,ws:ws===i,wp:wp===i,pts,score:G.players[G.sides[i][0]].score};
  });
  const sc=G.rows.map(r=>r.score),mx=Math.max(...sc),top=G.rows.filter(r=>r.score===mx);
  if(G.target===0){G.over=true;const hi=Math.max(...G.rows.map(r=>r.pts)),w=G.rows.filter(r=>r.pts===hi);G.winMembers=w.length===1?w[0].members.slice():null;}
  else if(mx>=G.target&&top.length===1){G.over=true;G.winMembers=top[0].members.slice();}
  G.phase='roundEnd';G.sel=null;G.tsel=[];
  if(ON&&ON.role==='host'){if(G.over)hostDrop();else hostSave();}
  render();
}

/* ===== Computer ===== */
const PW={7:3,6:2,1:1.4,5:1.1,4:.7,3:.5,2:.4,8:.2,9:.2,10:.2};
const cp=c=>1+(c.s===0?1.1:0)+(isSette(c)?9:0)+(PW[c.r]||.2);
// Livelli: risk = peso del rischio di lasciare carte prendibili/scopa all'avversario, noise = casualita', rnd = prob. di mossa a caso, count = conta le carte gia' uscite
const LV=[{risk:0,noise:5,rnd:.35,count:false},{risk:.35,noise:1.8,rnd:.08,count:false},{risk:.8,noise:.6,rnd:0,count:true},{risk:1,noise:0,rnd:0,count:true}];
function allMoves(i){
  const res=[];for(const c of G.players[i].hand){const opts=captures(c.r,G.table,G.variant);if(opts.length)opts.forEach(o=>res.push({c,take:o}));else res.push({c,take:[]});}
  return res;
}
function unseenFor(i,L){
  const known=new Set();G.players[i].hand.forEach(c=>known.add(c.id));G.table.forEach(c=>known.add(c.id));
  if(L.count)G.players.forEach(p=>p.pile.forEach(c=>known.add(c.id)));
  return makeDeck().filter(c=>!known.has(c.id));
}
// Perdita attesa se lascio queste carte sul tavolo (l'avversario muove subito dopo)
function riskOf(i,table,unseen){
  if(!table.length||!unseen.length)return 0;
  const U=unseen.length,cnt={};unseen.forEach(x=>cnt[x.r]=(cnt[x.r]||0)+1);
  const nh=G.players[nextIdx(i)].hand.length||3,list=[];
  for(let u=1;u<=10;u++){
    const k=cnt[u]||0;if(!k)continue;
    const opts=captures(u,table,G.variant);if(!opts.length)continue;
    let best=0;for(const o of opts){let v=o.reduce((a,x)=>a+cp(x),0)+1.5;if(o.length===table.length&&!(G.variant==='a'&&u===1))v+=9;if(v>best)best=v;}
    list.push({p:1-Math.pow(1-k/U,Math.min(nh,U)),v:best});
  }
  list.sort((a,b)=>b.v-a.v);
  let e=0,left=1;for(const x of list){e+=left*x.p*x.v;left*=1-x.p;}
  return e;
}
function moveScore(i,m,L,un){
  const c=m.c;let s=0;
  const after=m.take.length?G.table.filter(x=>!m.take.includes(x)):G.table.concat([c]);
  if(m.take.length){
    s+=cp(c)+m.take.reduce((a,x)=>a+cp(x),0);
    const lastPlay=G.stock.length===0&&G.players.every((p,k)=>k===i?p.hand.length===1:!p.hand.length);
    if(!after.length&&!lastPlay&&!(G.variant==='a'&&c.r===1))s+=9;
  }else s-=cp(c)*.5;
  if(L.risk)s-=L.risk*riskOf(i,after,un);
  return s-c.r*.01;
}
function chooseMove(i,L){
  const mv=allMoves(i);if(!mv.length)return null;
  if(Math.random()<L.rnd)return mv[Math.floor(Math.random()*mv.length)];
  const un=unseenFor(i,L);let best=null,bs=-1e9;
  for(const m of mv){const s=moveScore(i,m,L,un)+(L.noise?(Math.random()-.5)*2*L.noise:0);if(s>bs){bs=s;best=m;}}
  return best;
}
async function botTurn(i,g){
  const P=G.players[i],L=LV[P.lvl!==undefined?P.lvl:OPT.diff];
  const m=chooseMove(i,L);
  if(!m){endRound();return;}
  const r=applyMove(i,m.c.id,m.take.map(x=>x.id));
  say(moveText(r,k=>G.players[k].name));render();await sleep(1100);if(G!==g)return;
  afterMove();
}
// Istruttore: la mossa migliore per il giocatore umano
function coachHint(){
  const m=chooseMove(0,LV[3]);if(!m)return{text:''};

  if(a==='optdiff'){OPT.diff=(OPT.diff+1)%4;saveOpt();render();return;}
  if(a==='optdeck'){OPT.deck=(OPT.deck+1)%3;saveOpt();render();return;}
  if(a==='optteam'){OPT.team=!OPT.team;saveOpt();render();return;}
  if(a==='optvar'){OPT.variant=1-OPT.variant;saveOpt();render();return;}
  if(a==='optnet'){OPT.net=NEXTNET[OPT.net]||'p2p';saveOpt();render();return;}
  if(a==='hint'){if(ON)return;OPT.coach=!OPT.coach;saveOpt();render();return;}
  if(/^(online|oback|ocreate|ojoin|oseats|ograce|ostart|oshare|onet|oresume|odrop|orejoin|olast)$/.test(a)){onAct(a);return;}
  if(a==='newgame'||a==='exit'){if(ON)leaveOnline();G=null;UI.menu=false;if(tryUpd())return;render();return;}

  }

class MqttPeer{

function mkPeer(reuse,tries){

  const p=newPeer(PFX+code);ON.peer=p;
  p.on('open',()=>{if(!ON||ON.peer!==p)return;ON.code=code;if(ON.state==='starting'){if(ON.resume){const sv=ON.resume;ON.resume=null;hostRestore(sv);}else ON.state='lobby';render();}});

    if(e.type==='unavailable-id'){try{p.destroy();}catch(x){}if(reuse){if((tries||0)<40)setTimeout(()=>{if(ON&&ON.role==='host')mkPeer(reuse,(tries||0)+1);},2000);else onFail('Non riesco a riaprire la stanza.');}else mkPeer();return;}

}

    c.nick=nick;c.last=Date.now();ON.nicks.push(nick);ON.conns[nick]=c;lobbyBcast();notify('👋 '+nick+' è entrato');return;
  }
  c.last=Date.now();
  if(m.t==='ping'){try{c.send({t:'pong'});}catch(e){}return;}
  if(m.t==='mv'&&G){
    const k=G.players.findIndex(p=>p.conn===c);
    if(k>0&&G.turn===k&&G.phase==='wait'&&G.players[k].remote){
      const r=applyMove(k,m.cid,m.take);
      if(!r){ON.sent={};bcast();return;}
      say(moveText(r,i=>G.players[i].name));render();afterMove();
    }
  }
}
function hostLeft(c){
  if(!ON||ON.role!=='host')return;
  if(ON.state==='lobby'&&c.nick){const had=ON.nicks.includes(c.nick);ON.nicks=ON.nicks.filter(x=>x!==c.nick);delete ON.conns[c.nick];lobbyBcast();if(had)notify('🚪 '+c.nick+' è uscito');else render();return;}
  if(!G)return;
  const k=G.players.findIndex(p=>p.conn===c);if(k<1)return;
  const p=G.players[k];p.conn=null;notify('⚠️ '+p.name+' si è scollegato');
  if(G.turn===k&&G.phase!=='roundEnd')awayTurn(k);else render();
}
function awayTurn(k){
  const p=G.players[k];G.phase='wait';
  say(p.name+' è assente: lo aspetto '+ON.grace+' min…');render();
  ON.graceT=ON.graceT||{};clearTimeout(ON.graceT[k]);
  ON.graceT[k]=setTimeout(()=>{if(!ON||!G||p.conn)return;p.remote=false;if(G.turn===k&&G.phase!=='roundEnd')startTurn();},ON.grace*60000);
}
function onStart(){
  if(!ON||ON.state!=='lobby'||ON.nicks.length<2)return;
  ON.state='playing';
  startGame(ON.seats-1,false,g=>{ON.nicks.slice(1).forEach((nk,i)=>{const p=g.players[i+1];p.name=nk;p.nick=nk;p.wasHuman=true;p.remote=true;p.conn=ON.conns[nk];});});
}
function view(M,k){
  const n=M.players.length,map=i=>(i-k+n)%n,mine=M.turn===k&&M.phase!=='roundEnd';
  const v={variant:M.variant,round:M.round,target:M.target,over:M.over,err:false,mv:null,last:M.last};
  v.players=M.players.map((_,j)=>{const o=M.players[(j+k)%n];return{name:j===0?'Tu':(((j+k)%n)===0?ON.nicks[0]:o.name),human:j===0,hand:j===0?o.hand:o.hand.map((c,i)=>({id:-1000-j*100-i,s:0,r:1})),pile:o.pile,scope:o.scope,score:o.score};});
  v.table=M.table;v.stock=new Array(M.stock.length).fill(0);v.turn=map(M.turn);v.dealer=map(M.dealer);
  v.sides=M.sides.map(s=>s.map(map));
  v.rows=M.rows?M.rows.map(r=>Object.assign({},r,{members:r.members.map(map)})):null;
  v.winMembers=M.winMembers?M.winMembers.map(map):null;
  if(M.mv)v.mv={by:map(M.mv.by),card:M.mv.card,take:M.mv.take,scopa:M.mv.scopa};
  v.sel=null;v.tsel=[];
  v.phase=M.phase==='roundEnd'?'roundEnd':(mine?'play':'wait');
  const last=moveText(v.mv,i=>v.players[i].name);
  v.msg=(last?last+' ':'')+(mine?'Tocca a te: scegli una carta.':(M.phase==='roundEnd'?'':v.players[v.turn].name+' sta giocando…'));
  return v;
}
function bcast(){
  if(!ON||ON.role!=='host'||!G)return;
  ON.sent=ON.sent||{};
  G.players.forEach((p,k)=>{if(!p.remote||!p.conn)return;
    const g=view(G,k),s=JSON.stringify(g);if(ON.sent[k]===s)return;ON.sent[k]=s;
    try{p.conn.send({t:'st',g});}catch(e){}});
}
/* --- client --- */
/* --- client --- */
function onJoin(nick,code){
  
  setTimeout(wake,0);
  ON={role:'client',state:'connecting',nick,code,err:'',players:[],lastRx:Date.now(),net:code.length===5?({M:'mqtt',N:'ntfy'}[code[0]]||'p2p'):'p2p'};render();
  ON.pt=setInterval(()=>{if(!ON||ON.role!=='client')return;if(ON.state==='reconnecting'||!ON.conn||!ON.conn.open){if(ON.state==='playing'||ON.state==='waiting')clientDown();return;}const nt=NT(),now=Date.now();if(now-ON.lastRx>nt.cdown){try{ON.conn.close();}catch(e){}clientDown();return;}if(now-(ON.lastPing||0)>=nt.ping-300){ON.lastPing=now;try{ON.conn.send({t:'ping'});}catch(e){}}},4000);
  loadPeer(ok=>{
    if(!ON||ON.role!=='client')return;
    if(!ok){onFail('Serve la connessione internet.');return;}
    const p=newPeer();ON.peer=p;
    p.on('open',()=>{
      if(!ON||ON.peer!==p)return;
      const c=p.connect(PFX+code,{reliable:true,serialization:'json'});ON.conn=c;
      const to=setTimeout(()=>onFail('Non riesco a collegarmi. Controlla codice e parola; con la rete mobile il collegamento diretto può essere bloccato dall\'operatore: chi crea la stanza può scegliere MQTT.'),15000);
      c.on('open',()=>{clearTimeout(to);c.send({t:'hello',nick});ON.state='waiting';lastSave(nick,code);render();});
      c.on('data',m=>{if(ON&&ON.conn===c&&!c.dead){ON.lastRx=Date.now();clientMsg(m);}});
      c.on('close',()=>{clearTimeout(to);if(ON&&ON.conn===c&&!c.dead)clientDown();});
    });
    p.on('error',e=>{if(!ON||ON.peer!==p)return;onFail(e.type==='peer-unavailable'?'Stanza non trovata.':'Errore di rete ('+e.type+').');});
  });
}
function clientDown(){
  if(!ON||ON.role!=='client'||ON.state==='menu'||ON.state==='ended')return;
  if(ON.conn)ON.conn.dead=true;
  if(ON.state!=='reconnecting'){ON.back=ON.state==='waiting'?'waiting':'playing';ON.state='reconnecting';ON.since=Date.now();}
  render();scheduleRc(2000);
}
function scheduleRc(ms){clearTimeout(ON.rt);ON.rt=setTimeout(tryRc,ms);}
function tryRc(){
  if(!ON||ON.state!=='reconnecting')return;
  if(Date.now()-ON.since>900000){onFail('Connessione persa.');return;}
  if(ON.conn)ON.conn.dead=true;ON.conn=null;try{ON.peer&&ON.peer.destroy();}catch(e){}
  const p=newPeer();ON.peer=p;
  p.on('open',()=>{
    if(!ON||ON.peer!==p)return;
    const c=p.connect(PFX+ON.code,{reliable:true,serialization:'json'});ON.conn=c;
    c.on('open',()=>{c.send({t:'hello',nick:ON.nick});});
    c.on('data',m=>{if(ON&&ON.conn===c&&!c.dead){ON.lastRx=Date.now();clientMsg(m);}});
    c.on('close',()=>{if(ON&&ON.conn===c&&!c.dead)clientDown();});
    scheduleRc(9000);
  });
  p.on('error',()=>{if(ON&&ON.peer===p)scheduleRc(3000);});
}
function clientMsg(m){
  if(!ON||ON.role!=='client')return;
  if(ON.state==='reconnecting'&&(m.t==='st'||m.t==='lobby')){clearTimeout(ON.rt);ON.state=ON.back||'playing';}
  if(m.t==='pong')return;
  if(m.t==='reject'){onFail(m.why);return;}
  if(m.t==='lobby'){ON.players=m.players;ON.state='waiting';render();return;}
  if(m.t==='st'){
    const g=m.g,oSel=G?G.sel:null,oT=G?G.tsel:[];
    g.sel=null;g.tsel=[];if(g.over)lastDrop();
    if(g.phase==='play'&&oSel!==null&&g.players[0].hand.some(c=>c.id===oSel)){g.sel=oSel;g.tsel=oT.filter(id=>g.table.some(c=>c.id===id));}
    ON.applying=true;G=g;ON.state='playing';
    render();ON.applying=false;
  }
}
function netHook(){
  if(!ON||ON.applying||ON.state!=='playing'||!G)return;
  if(ON.role==='host'){clearTimeout(ON.bt);ON.bt=setTimeout(bcast,40);}
}
async function wake(){try{if(navigator.wakeLock&&ON&&ON.state!=='menu'&&ON.state!=='ended'){ON.wlk=await navigator.wakeLock.request('screen');}}catch(e){}}
function netWake(){
  if(!ON)return;wake();
  if(ON.role==='host'&&ON.peer&&ON.state!=='menu'){if(ON.peer.destroyed)mkPeer(ON.code);else if(ON.peer.disconnected){try{ON.peer.reconnect();}catch(e){}}}
  if(ON.role==='client'&&ON.state==='reconnecting')tryRc();
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)netWake();});
async function onAct(a){
  const val=id=>{const e=document.getElementById(id);return e?e.value.trim():'';};
  if(a==='online'){ON={state:'menu',nick:getNick(),key:getKey(),code:'',err:''};render();return;}
  if(a==='oback'){leaveOnline();render();return;}
  if(a==='ocreate'){const n=val('nick'),k=val('key');ON.key=k;ON.nick=n;if(!n){ON.err='Scrivi il tuo nome.';render();return;}if(!(await okKey(k))){ON.err='Parola d\'accesso errata.';render();return;}setNick(n);setKey(k);onHost(n);return;}
  if(a==='ojoin'){const n=val('nick'),c=val('code').toUpperCase(),k=val('key');ON.nick=n;ON.code=c;ON.key=k;if(!n||c.length<4){ON.err='Scrivi nome e codice stanza.';render();return;}if(!(await okKey(k))){ON.err='Parola d\'accesso errata.';render();return;}setNick(n);setKey(k);onJoin(n,c);return;}
  if(a==='oresume'){const sv=hostLoad(),k=val('key');if(!sv){ON.err='Nessuna partita salvata.';render();return;}if(!(await okKey(k))){ON.err='Parola d\'accesso errata.';render();return;}setKey(k);onHost(sv.nicks[0],sv);return;}
  if(a==='odrop'){hostDrop();render();return;}
  if(a==='olast'){lastDrop();render();return;}
  if(a==='orejoin'){const l=lastLoad(),k=val('key');if(!l){ON.err='Nessuna stanza ricordata.';render();return;}if(!(await okKey(k))){ON.err='Parola d\'accesso errata.';render();return;}setKey(k);setNick(l.nick);onJoin(l.nick,l.code);return;}
  if(a==='onet'){OPT.net=NEXTNET[OPT.net]||'p2p';try{localStorage.setItem('scopaopt',JSON.stringify(OPT));}catch(e){}if(ON){ON.nick=val('nick')||ON.nick;ON.key=val('key')||ON.key;}render();return;}
  if(a==='oseats'){ON.seats=ON.seats>=4?Math.max(2,ON.nicks.length):ON.seats+1;if(ON.seats<ON.nicks.length)ON.seats=ON.nicks.length;render();return;}
  if(a==='ograce'){ON.grace={1:3,3:5,5:10,10:1}[ON.grace]||3;render();return;}
  if(a==='ostart'){onStart();return;}
  if(a==='oshare'){const url=inviteUrl(),txt='Giochiamo a Scopa! Apri: '+url+' → 🌐 Gioca online → Entra nella stanza. Codice stanza: '+ON.code+'. La parola d\'accesso te la do io.';
    if(navigator.share){navigator.share({title:'Scopa',text:txt}).catch(()=>{});}else window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank');return;}
}
render();
let UPD=false;function tryUpd(){if(UPD&&!G){UPD=false;location.reload();return true;}return false;}
if('serviceWorker' in navigator){const had=!!navigator.serviceWorker.controller;window.addEventListener('load',()=>{try{navigator.serviceWorker.register('sw.js').catch(()=>{});navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!had)return;UPD=true;if(!tryUpd())render();});}catch(e){}});}
</script>
